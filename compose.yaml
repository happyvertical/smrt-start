# The container stack for the `self-hosted` runtime profile: the web process,
# a task worker, a schedule worker, a one-shot migration and PostgreSQL.
#
#   docker compose up --build        # then http://localhost:3000/sign-in
#
# It runs with no configuration. To do that it ships STAND-INS that you replace
# before real use (the README's "Replace before real use" lists each one):
#   - sign-in: email + password (SMRT_AUTHENTICATION_PROVIDER=password) with
#     the owner scripts/provision-owner.mjs creates (owner@example.com);
#   - assets: a directory on the `assets` volume (SMRT_ASSETS_PROVIDER=local-files);
#   - secrets: process environment (SMRT_SECRETS_PROVIDER=environment);
#   - PostgreSQL: the `database` service with a stand-in password.
# Override any value in an ignored `.env` file (Compose reads it).
#
# You do not need this to develop: `pnpm dev` and `pnpm app:*` run the `local`
# profile (SQLite, one process, loopback) with no containers.
x-runtime-environment: &runtime-environment
  SMRT_RUNTIME_PROFILE: self-hosted
  SMRT_AUTHENTICATION_PROVIDER: ${SMRT_AUTHENTICATION_PROVIDER:-password}
  SMRT_ASSETS_PROVIDER: ${SMRT_ASSETS_PROVIDER:-local-files}
  SMRT_SECRETS_PROVIDER: ${SMRT_SECRETS_PROVIDER:-environment}
  SMRT_ASSETS_DIR: /data/assets
  DATABASE_URL: ${DATABASE_URL:-postgresql://smrt_start:${POSTGRES_PASSWORD:-smrt-start-stand-in}@database:5432/smrt_start}
  HOST: 0.0.0.0
  PORT: "3000"
  SMRT_WORKER_CONCURRENCY: "4"
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

# Deployment declaration (contract version 1, see the s-m-r-t deployment
# guide). Compose ignores `x-` keys, so this file runs as it always would. A
# platform that reads the contract deploys the `role` services from image
# digests, runs `migrate` before each release, and provides its own service in
# place of every `binding`. Check it with `pnpm deploy:check`.
#
# `entrypoint` on the three application services repeats the node image's own
# entrypoint, so Compose runs exactly what the image would, and a rendering
# that replaces the entrypoint (the smrt-app chart) starts the same process.
x-happyvertical:
  version: 1
  preset: smrt
  # domain: app.example.com
  migrate:
    command: ["pnpm", "exec", "smrt", "db:migrate"]

services:
  web:
    build: .
    environment: *runtime-environment
    entrypoint: ["docker-entrypoint.sh"]
    command: node build
    ports:
      - "3000:3000"
    volumes:
      - assets:/data/assets
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/_runtime/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    x-happyvertical:
      role: web
      health:
        path: /api/_runtime/health
  worker:
    build: .
    environment: *runtime-environment
    entrypoint: ["docker-entrypoint.sh"]
    command: pnpm exec smrt app worker task
    volumes:
      - assets:/data/assets
    depends_on:
      migrate:
        condition: service_completed_successfully
    x-happyvertical:
      role: worker
      health:
        command: ["pnpm", "exec", "smrt", "app", "doctor"]
  schedule-worker:
    build: .
    environment: *runtime-environment
    entrypoint: ["docker-entrypoint.sh"]
    command: pnpm exec smrt app worker schedule
    volumes:
      - assets:/data/assets
    depends_on:
      migrate:
        condition: service_completed_successfully
    x-happyvertical:
      role: worker
      health:
        command: ["pnpm", "exec", "smrt", "app", "doctor"]
  # Local and self-hosted one-shot migration. It has no annotation, so a
  # platform does not run it: there the `migrate` command above runs inside
  # the web image. It also creates the stand-in owner (see the header).
  migrate:
    build:
      context: .
      target: build
    environment:
      <<: *runtime-environment
      SMRT_OWNER_EMAIL: ${SMRT_OWNER_EMAIL:-}
      SMRT_OWNER_PASSWORD: ${SMRT_OWNER_PASSWORD:-}
    command: sh -c "pnpm app:setup && pnpm provision:owner"
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    environment:
      POSTGRES_DB: smrt_start
      POSTGRES_USER: smrt_start
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smrt-start-stand-in}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smrt_start"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      # PostgreSQL 18+ keeps PGDATA under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    x-happyvertical:
      binding: postgres

volumes:
  postgres-data:
  assets:
